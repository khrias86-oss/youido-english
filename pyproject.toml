[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umppa-monitor"
version = "0.1.0"
description = "서울형 키즈카페(우리동네키움포털) 빈자리 감시·알림 시스템"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
umppa-monitor = "umppa_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["umppa_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
