# umppa-monitor 배포 설정
# 원래 요청의 예약 페이지(https://umppa.seoul.go.kr/icare/user/kidsCafeResve/BD_selectKidsCafeResveCal.do?q_fcltyId=YF260101)를 감시합니다.
# ntfy 토픽은 비밀 값이 아니라 채널 식별자입니다. 휴대폰에 ntfy 앱을 설치한 뒤
# 아래 topic 이름을 그대로 구독하면 빈자리 알림을 받을 수 있습니다.
# 앱: https://ntfy.sh (iOS/Android 무료, 가입 불필요)
#
# click_dates: false — 실사이트 확인 결과 이 시설(YF260101)은 달력 화면 자체에
# 회차별 잔여 인원이 함께 표시되어("N회 개인/공용 잔여인원") 날짜를 클릭해
# 상세 팝업을 열 필요가 없다. 클릭 시 로딩 마스크에 걸려 시간이 오래 걸리므로
# 끄면 더 빠르고 안정적이다. months_ahead: 0 — "다음 달" 이동 버튼 인식은
# 아직 이 사이트에서 확인되지 않아, 우선 이번 달만 본다(예약은 원래 1~2주
# 앞만 열리므로 실사용에는 영향이 적다).

targets:
  - type: kidscafe
    id: YF260101
    name: 서울형 키즈카페 (YF260101)
    months_ahead: 0
    click_dates: false
    weekdays: []
    dates: []
    sessions: []
    min_remaining: 1

notifiers:
  - type: ntfy
    topic: kidscafe-yf260101-105d2e8010fb
  - type: console

browser:
  headless: true
  timeout_ms: 30000

schedule:
  interval_sec: 600
  jitter_sec: 30
  quiet_hours: ["00:30-06:30"]
  notify_on_close: false
  renotify_after_min: 0

state_dir: state
artifacts_dir: artifacts
log_level: INFO
