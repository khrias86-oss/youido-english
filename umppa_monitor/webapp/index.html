<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c6ef5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="서울형 키즈카페 빈자리를 달력으로 보고, 감시할 날짜·회차를 고르는 앱">
<title>키즈카페 빈자리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-main">
    <h1>키즈카페 빈자리</h1>
    <p class="freshness" id="freshness">불러오는 중…</p>
  </div>
  <button class="icon-btn" id="reload" type="button" aria-label="새로고침">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg>
  </button>
</header>

<main id="main">
  <div class="skeleton" id="boot" role="status">현황을 불러오는 중입니다…</div>
</main>

<div class="savebar" id="savebar" hidden>
  <div class="savebar-text" id="savebar-text">변경한 조건이 있습니다</div>
  <button class="btn" id="save" type="button">감시 조건 저장</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
