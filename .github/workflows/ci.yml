name: ci
on:
  push:
    # webdata 는 감시 결과(data.json)만 담는 데이터 브랜치다. 10분마다 갱신되므로
    # 테스트를 돌릴 이유가 없다.
    branches-ignore: ["webdata"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
